<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orchestrador 量化研究控制台</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">ORCHESTRADOR</p>
        <h1>量化研究控制台</h1>
        <p class="subtitle">调用研究与数据分析能力，沉淀可复核的研究结果。</p>
        <p class="scope-note">当前处于研究基础建设阶段，不支持直接交易、下单或绕过独立风控。</p>
      </div>
      <div id="service-status" class="status status-loading" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span>正在检查服务</span>
      </div>
      <nav class="user-nav"><span id="current-user"></span><a id="admin-link" href="/admin" hidden>用户管理</a><button id="logout" class="secondary">退出</button></nav>
    </header>

    <section class="overview" aria-label="运行概览">
      <article class="metric">
        <span class="metric-label">当前模型</span>
        <strong id="model-name">读取中</strong>
        <span id="model-endpoint" class="metric-meta">—</span>
      </article>
      <article class="metric">
        <span class="metric-label">可用 Graph</span>
        <strong id="graph-count">—</strong>
        <span id="graph-names" class="metric-meta">—</span>
      </article>
      <article class="metric">
        <span class="metric-label">请求超时</span>
        <strong id="request-timeout">—</strong>
        <span class="metric-meta">单次调用上限</span>
      </article>
    </section>

    <section class="workspace">
      <form id="invoke-form" class="composer">
        <div class="section-heading">
          <div>
            <p class="eyebrow">GRAPH INVOKE</p>
            <h2>发起分析</h2>
          </div>
          <a href="/docs" target="_blank" rel="noreferrer">API 文档</a>
        </div>

        <label for="graph-select">智能体</label>
        <select id="graph-select" name="graph" required></select>
        <p id="graph-description" class="field-help">正在读取智能体能力…</p>

        <label for="model-select">基座模型</label>
        <select id="model-select" name="model" required></select>

        <label for="thread-id">Thread ID</label>
        <div class="thread-row">
          <input id="thread-id" name="thread" autocomplete="off" required>
          <button id="new-thread" type="button" class="secondary">新建</button>
        </div>

        <label for="prompt">问题或分析要求</label>
        <textarea id="prompt" name="prompt" rows="8" required placeholder="例如：查询最近一周的数据并总结主要变化"></textarea>

        <div class="action-row">
          <button id="submit-button" type="submit" class="primary">开始运行</button>
          <button id="cancel-button" type="button" class="secondary" hidden>取消请求</button>
          <button id="retry-runtime" type="button" class="secondary" hidden>重新加载配置</button>
        </div>
        <p id="form-error" class="error" role="alert"></p>
      </form>

      <section class="result" aria-labelledby="result-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">RESULT</p>
            <h2 id="result-title">运行结果</h2>
          </div>
          <span id="elapsed-time" class="elapsed">等待调用</span>
        </div>

        <div id="empty-state" class="empty-state">
          <p>选择智能体并提交问题后，回答、图表和原始数据会显示在这里。</p>
        </div>

        <div id="result-content" class="result-content" hidden aria-live="polite">
          <article class="answer-block">
            <div class="answer-heading">
              <h3>智能体回答</h3>
              <button id="copy-answer" type="button" class="text-button">复制结果</button>
            </div>
            <dl class="result-meta" aria-label="本次运行信息">
              <div><dt>智能体</dt><dd id="result-graph">—</dd></div>
              <div><dt>模型</dt><dd id="result-model">—</dd></div>
              <div><dt>Thread ID</dt><dd id="result-thread">—</dd></div>
              <div><dt>完成时间</dt><dd id="result-finished">—</dd></div>
            </dl>
            <div id="answer-text" class="answer-text"></div>
          </article>

          <section id="image-section" class="image-section" hidden>
            <h3>分析附件与图表</h3>
            <div id="image-gallery" class="image-gallery"></div>
          </section>

          <details class="raw-data">
            <summary>查看原始返回数据</summary>
            <pre id="raw-json"></pre>
          </details>
        </div>
      </section>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
