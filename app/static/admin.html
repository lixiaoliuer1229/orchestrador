<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户管理 · Orchestrador</title><link rel="stylesheet" href="/static/styles.css"></head><body><main class="shell"><header class="topbar"><div><p class="eyebrow">ADMIN</p><h1>用户管理</h1><p class="subtitle">创建和停用 Orchestrador 账号。</p></div><a class="nav-link" href="/">返回控制台</a></header><section class="admin-grid"><form id="user-form" class="composer"><h2>创建账号</h2><label for="new-username">用户名</label><input id="new-username" pattern="[A-Za-z0-9_.-]{3,64}" required><label for="new-password">初始密码</label><input id="new-password" type="password" minlength="12" autocomplete="new-password" required><label for="new-role">角色</label><select id="new-role"><option value="user">普通用户</option><option value="admin">管理员</option></select><button class="primary" type="submit">创建账号</button><p id="admin-error" class="error" role="alert"></p></form><section class="result"><div class="section-heading"><h2>现有账号</h2><button id="refresh" class="secondary">刷新</button></div><div class="table-wrap"><table><thead><tr><th>用户名</th><th>角色</th><th>状态</th><th>最后登录</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div></section></section></main><script src="/static/admin.js" defer></script></body></html>
